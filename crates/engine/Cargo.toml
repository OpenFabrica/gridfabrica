[package]
name = "gridfabrica-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridFabrica engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[dependencies]
gridfabrica-core = { workspace = true }
gridfabrica-numfmt = { workspace = true }
gridfabrica-formula = { workspace = true }
gridfabrica-functions = { workspace = true }
gridfabrica-model = { workspace = true }
gridfabrica-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridfabrica-xlsx = { workspace = true }
gridfabrica-chart = { workspace = true }
gridfabrica-pdf = { workspace = true }
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

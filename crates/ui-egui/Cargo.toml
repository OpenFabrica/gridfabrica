[package]
name = "gridfabrica-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridFabrica egui frontend (Excel-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
gridfabrica-engine = { workspace = true }
gridfabrica-chart = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
read-fonts = "0.41"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true, features = ["default_fonts"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[package]
name = "gridfabrica"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "gridfabrica"
description = "GridFabrica desktop app"

[lints]
workspace = true

[dependencies]
gridfabrica-engine = { workspace = true }
gridfabrica-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for gridfabrica.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
